name: Desktop builds (Windows + macOS)

# Builds the LoomHR desktop app on each OS's own runner (electron-builder
# cannot cross-build a macOS .dmg from Windows). Run manually to get artifacts,
# or push a tag like v1.0.1 to publish a GitHub Release with the auto-update
# feed (latest.yml) so installed apps update themselves.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: "--win nsis"
          - os: macos-latest
            target: "--mac dmg zip"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Next standalone bundle
        run: npm run desktop:prepare

      - name: Build & publish desktop app
        run: npx electron-builder ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loomhr-${{ matrix.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/latest*.yml
          if-no-files-found: warn
